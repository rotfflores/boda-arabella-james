name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp styles.css _site/styles.css
          mkdir -p _site/assets
          cp assets/flor-roja.png _site/assets/flor-roja.png
          cp assets/save-our-date.png _site/assets/save-our-date.png
          cp assets/couple-photos.png _site/assets/couple-photos.png
          cp assets/planta-izquierda.png _site/assets/planta-izquierda.png
          cp assets/planta-superior.png _site/assets/planta-superior.png
          cp assets/planta-derecha.png _site/assets/planta-derecha.png
          cp assets/encaje-bordado.png _site/assets/encaje-bordado.png
          cp assets/invitacion-completa.png _site/assets/invitacion-completa.png
          cp assets/sobre-cerrado.png _site/assets/sobre-cerrado.png
          cp assets/sobre-abierto.png _site/assets/sobre-abierto.png
          cp assets/fondo-terciopelo.png _site/assets/fondo-terciopelo.png
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
