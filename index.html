<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#570012">
  <meta name="description" content="Save the date for Arabella and James — Lake Como, Italy, 22.07.2027.">
  <title>Arabella &amp; James | 22.07.2027</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="envelope-screen" aria-label="Open wedding invitation">
    <button class="envelope-button" type="button" aria-label="Open Arabella and James's invitation">
      <img class="envelope-closed" src="assets/sobre-cerrado.png" alt="Closed wedding envelope with the monogram AJ">
      <img class="envelope-open" src="assets/sobre-abierto.png" alt="" aria-hidden="true">
    </button>
    <p class="open-hint">Toca el sobre para abrir</p>
  </section>
  <main class="invitation-stage">
    <div class="piece piece-lace" aria-hidden="true"></div>
    <div class="piece piece-plants" aria-hidden="true"></div>
    <div class="piece piece-photo-one" aria-hidden="true"></div>
    <div class="piece piece-photo-two" aria-hidden="true"></div>
    <div class="piece piece-save-date" aria-hidden="true"></div>
    <div class="piece piece-envelope" aria-hidden="true"></div>
    <div class="piece piece-flower" aria-hidden="true"></div>
    <div class="piece piece-heading" aria-hidden="true"></div>
    <div class="piece piece-footer" aria-hidden="true"></div>
    <img class="invitation" src="assets/invitacion-completa.png" alt="We're getting married! Arabella and James. Save our Date: 22.07.2027, Lake Como, Italy. Formal invitation to follow.">
  </main>
  <script>
    const button = document.querySelector('.envelope-button');
    button.addEventListener('click', () => {
      if (document.body.classList.contains('opening')) return;
      document.body.classList.add('opening');
      button.disabled = true;
      window.setTimeout(() => document.body.classList.add('revealed'), 1250);
    });
  </script>
</body>
</html>
