<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#570012">
  <meta name="description" content="Reserva la fecha para la boda de Arabella y James — Lago de Como, Italia, 22.07.2027.">
  <title>Arabella &amp; James | 22.07.2027</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="envelope-screen" aria-label="Abrir invitación de boda">
    <button class="envelope-button" type="button" aria-label="Abrir la invitación de Arabella y James">
      <img src="assets/sobre-cerrado.png" alt="Sobre de boda cerrado con el monograma AJ">
    </button>
    <p>Toca el sobre para abrir</p>
  </section>

  <main class="invitation-stage" aria-label="Wedding invitation for Arabella and James">
    <header class="heading item-heading">
      <p>¡Nos casamos!</p>
      <h1>Arabella <span>&amp;</span> James</h1>
    </header>

    <section class="arrangement" tabindex="-1" aria-label="Sobre abierto con los detalles de la fecha">
      <div class="envelope-back"></div>
      <img class="lace item-lace" src="assets/encaje-bordado.png" alt="" aria-hidden="true">
      <img class="plant plant-left item-plant-left" src="assets/planta-izquierda.png" alt="" aria-hidden="true">
      <img class="plant plant-top item-plant-top" src="assets/planta-superior.png" alt="" aria-hidden="true">
      <img class="plant plant-right item-plant-right" src="assets/planta-derecha.png" alt="" aria-hidden="true">

      <div class="polaroid polaroid-one item-photo-one" role="img" aria-label="Photo of Arabella and James"></div>
      <div class="polaroid polaroid-two item-photo-two" role="img" aria-label="Photo of Arabella and James"></div>
      <div class="save-date item-save-date" aria-label="Reserva la fecha"><span>Reserva</span><small>la fecha</small></div>
      <img class="date-flower item-date-flower" src="assets/flor-roja.png" alt="22.07.2027, Lake Como, Italy">

      <div class="envelope-front"></div>
      <img class="seal item-seal" src="assets/sello-aj.png" alt="Sello de cera con las iniciales A y J">
    </section>

    <footer class="closing item-footer">
      <p>Lago de Como, Italia</p>
      <strong>22.07.2027</strong>
      <span>Invitación formal próximamente</span>
    </footer>
  </main>

  <script>
    const button = document.querySelector('.envelope-button');
    const arrangement = document.querySelector('.arrangement');
    button.addEventListener('click', () => {
      if (document.body.classList.contains('revealed')) return;
      button.disabled = true;
      document.body.classList.add('opening');
      window.setTimeout(() => {
        document.body.classList.add('revealed');
        arrangement.focus({ preventScroll: true });
        window.requestAnimationFrame(() => {
          arrangement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      }, 650);
    });
  </script>
</body>
</html>
